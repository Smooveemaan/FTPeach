name: Bug report
description: Report something that does not work as expected (not a security vulnerability)
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Found a security vulnerability?** Do not open a public issue; report it privately as described in [SECURITY.md](https://github.com/Smooveemaan/ftpeach/blob/master/.github/SECURITY.md).

        Please remove passwords, private keys, server addresses, user names and private paths from anything you paste or attach.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/Smooveemaan/ftpeach/issues?q=is%3Aissue) and did not find this problem.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead. Include the exact text of any error message.
      placeholder: |
        I tried to upload a folder over SFTP. I expected all the files to upload, but the transfer stopped at 99% and the last file stayed "Waiting".
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List the steps that make the problem appear, starting from a fresh launch if possible.
      placeholder: |
        1. Connect to an SFTP server.
        2. Drag a folder with 500 small files to the remote pane.
        3. Watch the transfer queue.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Happened once
    validations:
      required: true
  - type: input
    id: ftpeach-version
    attributes:
      label: FTPeach version
      description: Shown in **Help > About**.
      placeholder: 0.6.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Press Win+R, run `winver`, and copy the version and build.
      placeholder: Windows 11 24H2 (build 26100.2605)
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Which protocol does it involve?
      multiple: true
      options:
        - Not applicable
        - FTP
        - FTPS (explicit TLS)
        - SFTP
        - WebDAV
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software (optional)
      description: If you know it, give the software and version, such as OpenSSH 9.6 or Nextcloud 29. Do not include the server address.
      placeholder: OpenSSH 9.6
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (optional)
      description: |
        Copy only the lines related to the problem. You can enable logging under **Settings > Logging > Write log to file** and use **Open log folder** there.
        Passwords and tokens are redacted automatically, but server names, IP addresses and paths are not. Please review the lines before posting.
      render: text
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or diagnostic information (optional)
      description: |
        Drag screenshots or a screen recording here if they help show the problem.
        For a problem that is hard to reproduce, you can attach a bundle from **Settings > Logging > Export diagnostic bundle** after reviewing its contents.
  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: For example, when the problem started, a workaround you found, or whether you use a proxy, VPN or antivirus.
