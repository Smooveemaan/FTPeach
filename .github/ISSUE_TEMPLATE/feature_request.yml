name: Feature request
description: Suggest a new feature or an improvement to an existing one
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea. Start with what you are trying to do: that helps us understand where FTPeach gets in the way and find the best solution.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/Smooveemaan/ftpeach/issues?q=is%3Aissue) and did not find this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and why it is difficult or impossible right now.
      placeholder: I upload the same set of folders to three servers every day and have to repeat the drag and drop for each of them.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like FTPeach to do?
      description: Describe how you would like it to work from your point of view.
      placeholder: Let me select several saved connections and upload the selection to all of them at once.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Have you found a workaround? (optional)
      description: Tell us how you handle this today, or share an example from another app.
  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Add mockups, screenshots or links that help explain the idea.
