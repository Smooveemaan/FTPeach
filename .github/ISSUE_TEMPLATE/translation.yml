name: Translation problem
description: Report wrong, missing, cut-off or awkward text in any interface language
title: '[Translation]: '
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the translations. Feedback from people who use FTPeach in any of its 27 languages is welcome.
        New text may appear in English first until it is translated; you can still report it so it gets translated sooner.
  - type: dropdown
    id: language
    attributes:
      label: Which language is affected?
      options:
        - Arabic
        - Chinese (Simplified)
        - Chinese (Traditional)
        - Czech
        - Danish
        - Dutch
        - English
        - French
        - German
        - Greek
        - Hebrew
        - Hindi
        - Hungarian
        - Indonesian
        - Italian
        - Japanese
        - Korean
        - Polish
        - Portuguese (Brazil)
        - Romanian
        - Russian
        - Spanish
        - Swedish
        - Thai
        - Turkish
        - Ukrainian
        - Vietnamese
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      multiple: true
      options:
        - Wrong or misleading translation
        - Text is still in English
        - Text is cut off or overlaps other elements
        - Grammar, spelling or punctuation
        - Inconsistent terminology
        - Right-to-left layout problem
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where does the text appear?
      description: Name the window, dialog, menu or setting that shows it.
      placeholder: Settings > Logging, the hint under "Write log to file"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What does it say now? (optional)
      description: Copy the text exactly as shown if you can, or attach a screenshot below.
      render: text
  - type: textarea
    id: suggested
    attributes:
      label: What should it say instead? (optional)
      description: Suggest a better translation and, if helpful, explain why. For example, mention the term other file managers use.
      render: text
  - type: input
    id: ftpeach-version
    attributes:
      label: FTPeach version
      description: Shown in **Help > About**.
      placeholder: 0.6.0
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Especially helpful for cut-off or overlapping text. Please hide server names and private paths.
