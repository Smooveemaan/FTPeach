name: Checks

permissions: {}

# Shared verification suite for CI and releases.
on:
  workflow_call:
    inputs:
      force-all:
        description: >-
          Run every job regardless of changed paths. Enabled for releases and manual CI.
        type: boolean
        default: false

jobs:
  changes:
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required-gates: ${{ steps.classify.outputs.required-gates }}
      required-checks: ${{ steps.classify.outputs.required-checks }}
      tooling-only: ${{ steps.classify.outputs.tooling-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The classifier needs both commits, which a shallow clone may lack.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - id: classify
        env:
          FORCE_ALL: ${{ inputs.force-all }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node --experimental-strip-types scripts/checks/classify-changes.ts --source=github

  supply-chain:
    permissions:
      contents: read
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:tracked-secrets
      - run: npm run check:release-config
      - run: npm run licenses:check
      - run: npm run check:ignored-tests
      - run: npm run check:command-acl
      - run: npm run check:rust-boundaries
      - run: npm run check:rust-advisories
      - run: npm run check:no-cyrillic
      - run: npm run i18n:check
        if: needs.changes.result != 'success' || contains(fromJSON(needs.changes.outputs.required-checks || '[]'), 'i18n:check')
      - run: npm run check:docs
        if: needs.changes.result != 'success' || contains(fromJSON(needs.changes.outputs.required-checks || '[]'), 'check:docs')
      - run: npm run check:verified-by
        if: needs.changes.result != 'success' || contains(fromJSON(needs.changes.outputs.required-checks || '[]'), 'check:verified-by')
      - run: npm run format:check
        if: needs.changes.result != 'success' || contains(fromJSON(needs.changes.outputs.required-checks || '[]'), 'format:check')
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses

  sast:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'sast')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 # 1.176.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One fixture per run: given the directory, this Semgrep reports "No unit
      # tests found" and exits 0, which verified nothing.
      - name: Verify vulnerable and safe SAST fixtures
        run: |
          for fixture in .semgrep/security.rs .semgrep/security.tsx; do
            semgrep scan --test --config .semgrep/security.yml "$fixture" --metrics=off --disable-version-check > sast-fixtures.log 2>&1 || { cat sast-fixtures.log; exit 1; }
            cat sast-fixtures.log
            grep -q "All tests passed" sast-fixtures.log
          done
      - name: Scan Rust and renderer sources
        run: semgrep scan --config .semgrep/security.yml --error --strict --metrics=off --disable-version-check src-tauri/src src

  lint-test-build:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'lint-test-build')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:ci-parity
      - run: npm run check:duplicates
      - name: Keep the duplication report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duplication-report
          path: duplication-report/
          if-no-files-found: ignore
      - run: npm run lint
      - run: npm test
        if: ${{ !inputs.force-all && needs.changes.outputs.tooling-only != 'true' }}
      - name: Test development tooling
        if: needs.changes.outputs.tooling-only == 'true'
        run: node --experimental-strip-types --test $(find test/unit/tooling -name '*.test.ts' ! -name 'site*.test.ts')
      - run: npm run coverage
        if: inputs.force-all
      - name: Keep the coverage report
        if: ${{ always() && inputs.force-all }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: coverage/
          if-no-files-found: ignore
      - run: npm run build
        if: needs.changes.outputs.tooling-only != 'true'
      - name: Keep the startup bundle report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-report
          path: dist/bundle-report.json
          if-no-files-found: ignore

  parser-regressions:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'parser-regressions')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri/fuzz
      - name: Replay saved parser regression inputs
        run: npm run test:parser-regressions

  # The server matrix builds the crate on Linux; rust-test only on Windows.
  rust-linux:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'rust-linux')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev dosfstools
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: No-replace operations on FAT
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d "$RUNNER_TEMP/ftpeach-fat.XXXXXX")
          mount_dir="$fixture/mount"
          mkdir "$mount_dir"
          truncate -s 64M "$fixture/disk.img"
          mkfs.vfat -F 32 "$fixture/disk.img"
          sudo mount -t vfat -o "loop,uid=$(id -u),gid=$(id -g)" "$fixture/disk.img" "$mount_dir"
          trap 'sudo umount "$mount_dir"' EXIT
          FTPEACH_FAT_TEST_ROOT="$mount_dir" cargo test --locked --manifest-path src-tauri/Cargo.toml --features test-utils --lib no_replace_on_fat_needs_no_hard_links -- --ignored

  rust-test:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'rust-test')
    # This crate has unconditional Windows and WebView2 dependencies.
    runs-on: windows-latest
    # Allow headroom for a cold Rust build and cache save.
    timeout-minutes: 25
    env:
      # Share compiler results across jobs when the workspace cache misses.
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pinned Rust toolchain
        run: rustup component add clippy rustfmt

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      # The features the application ships with; the steps below turn on more.
      - name: Check with default features
        run: npm run rust:check
      - name: Clippy
        run: npm run rust:clippy
      - name: Test
        run: npm run rust:test
      # Check both valid and damaged updater artifacts.
      - name: Verify valid and damaged updater fixtures independently
        run: npm run test:updater-fixtures

  # Every target runs so one failure does not hide the next.
  rust-test-unix:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'rust-test-unix')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - name: Install pinned Rust toolchain
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test
        if: ${{ always() }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features test-utils --all-targets --no-fail-fast

  rust-coverage:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'rust-coverage')
    runs-on: windows-latest
    # An instrumented build of the whole crate, separate from rust-test's cache.
    timeout-minutes: 35
    env:
      COVERAGE_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install pinned Rust toolchain
        run: rustup component add llvm-tools-preview

      - name: Restore pinned cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: ~/.cargo/bin/cargo-llvm-cov.exe
          key: cargo-llvm-cov-0.9.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install pinned cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.9.1

      - name: Check pinned cargo-llvm-cov
        run: cargo llvm-cov --version

      - run: npm run rust:coverage
      - name: Keep the Rust coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage/
          if-no-files-found: ignore

  visual-regression:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'visual-regression')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run test:visual
      # Keep diagnostics for failures and retry-passes recorded as flaky.
      - name: Keep the visual test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-results
          path: test-results/visual/
          if-no-files-found: ignore
          retention-days: 14

  i18n-audit-sample:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'i18n-audit-sample')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium
      # The layout audit in a sample of languages: the pseudo-locale, the most
      # text (Greek), long words (Dutch), right to left (Arabic) and Japanese.
      # i18n-audit.yml runs every language weekly.
      - run: npm run i18n:audit
        env:
          I18N_AUDIT_LANGS: pseudo,el,nl,ar,ja
      - name: Keep the i18n audit results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n-audit-results
          path: test-results/i18n-audit/
          if-no-files-found: ignore
          retention-days: 14

  packaged-smoke:
    permissions:
      contents: read
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.required-gates), 'packaged-smoke')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Share compiler results with the Rust test job.
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Linux smoke dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xvfb dbus-x11
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # smoke-build writes to this target directory instead of src-tauri/target.
          cache-directories: .tools/smoke-target

      - run: npm ci
      - run: npm run build:packaged-smoke
      - name: Select a fixed WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $evergreen = Get-ItemProperty -ErrorAction SilentlyContinue 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "Evergreen WebView2: $($evergreen.pv)"
          $cab = Join-Path $env:RUNNER_TEMP 'Microsoft.WebView2.FixedVersionRuntime.156.0.4314.58.x64.cab'
          $runtime = Join-Path $env:RUNNER_TEMP 'ftpeach-webview2-156.0.4314.58'
          Invoke-WebRequest -Uri 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/b7919cc9-680d-4253-bf32-732988e68aa6/Microsoft.WebView2.FixedVersionRuntime.156.0.4314.58.x64.cab' -OutFile $cab
          $hash = (Get-FileHash -Algorithm SHA256 $cab).Hash.ToLowerInvariant()
          if ($hash -ne '857dcfd6f7035508a29645fa2978c3a6a841f220df77cc366d318894e19f4792') {
            throw "Unexpected WebView2 runtime SHA256: $hash"
          }
          New-Item -ItemType Directory -Path $runtime | Out-Null
          & "$env:WINDIR\System32\expand.exe" -F:* $cab $runtime | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "WebView2 extraction failed: $LASTEXITCODE" }
          $executable = Get-ChildItem -Path $runtime -Filter msedgewebview2.exe -Recurse | Select-Object -First 1
          if (-not $executable) { throw 'WebView2 executable is missing from the verified package' }
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$($executable.DirectoryName)" >> $env:GITHUB_ENV
          $executable.VersionInfo.ProductVersion
      - name: Run packaged smoke under Xvfb
        if: runner.os == 'Linux'
        env:
          TAURI_DRIVER_DEBUG: '1'
        run: dbus-run-session -- xvfb-run -a npm run test:packaged-smoke
      - name: Run packaged smoke
        if: runner.os != 'Linux'
        env:
          TAURI_DRIVER_DEBUG: '1'
        run: npm run test:packaged-smoke

  full-result:
    needs:
      [
        changes,
        supply-chain,
        sast,
        lint-test-build,
        parser-regressions,
        rust-linux,
        rust-test,
        rust-test-unix,
        rust-coverage,
        visual-regression,
        i18n-audit-sample,
        packaged-smoke,
      ]
    if: always() && inputs.force-all
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject missing or unsuccessful mandatory checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const results = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(results)) { if (job.result !== "success") throw new Error(`${name} did not succeed`); }'
