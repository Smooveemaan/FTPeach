name: CI

permissions: {}

on:
  # Version tags never start a second release; branches use pull requests.
  push:
    branches: [master]
  pull_request:
  # Manual runs verify the full suite.
  workflow_dispatch:

# A newer push to a pull request replaces its older run; every push to master runs
# to the end, so a later push never hides an earlier one's results.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  mode:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.mode.outputs.full }}
      release: ${{ steps.mode.outputs.release }}
      required-gates: ${{ steps.classify.outputs.required-gates }}
      required-checks: ${{ steps.classify.outputs.required-checks }}
      tooling-only: ${{ steps.classify.outputs.tooling-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The classifier needs both commits, which a shallow clone may lack.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: mode
        run: node --experimental-strip-types scripts/release/check-mode.ts
      - id: classify
        env:
          FORCE_ALL: ${{ steps.mode.outputs.full }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node --experimental-strip-types scripts/checks/classify-changes.ts --source=github

  # The suite itself lives in checks.yml, shared with release.yml.
  checks:
    needs: mode
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      force-all: ${{ needs.mode.outputs.full == 'true' }}
      classified: ${{ needs.mode.result == 'success' }}
      required-gates: ${{ needs.mode.outputs.required-gates || '[]' }}
      required-checks: ${{ needs.mode.outputs.required-checks || '[]' }}
      tooling-only: ${{ needs.mode.outputs.tooling-only == 'true' }}

  private-check:
    needs: mode
    if: needs.mode.outputs.release == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Launch or reconnect to the closed check
        env:
          PRIVATE_CHECK_TOKEN: ${{ secrets.PRIVATE_CHECK_TOKEN }}
          PRIVATE_CHECK_CONFIG: ${{ secrets.PRIVATE_CHECK_CONFIG }}
        run: node --experimental-strip-types scripts/release/private-check.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-check-${{ github.run_attempt }}
          path: private-check.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [mode, checks, private-check]
    if: needs.mode.outputs.release == 'true'
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
