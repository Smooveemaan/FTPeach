name: CI

permissions: {}

on:
  # Tags use release.yml; feature branches are checked through pull requests.
  push:
    branches: [master]
  pull_request:

# A newer push to a pull request replaces its older run; every push to master runs
# to the end, so a later push never hides an earlier one's results.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # The suite itself lives in checks.yml, shared with release.yml.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
