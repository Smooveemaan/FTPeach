name: CP-1 Visual and i18n experiment

permissions: {}

on:
  workflow_dispatch:
    inputs:
      visual-workers:
        description: Number of Playwright workers for the full Visual suite
        required: true
        default: '2'
        type: choice
        options:
          - '2'
          - '6'
      parallel-i18n:
        description: Run the sampled i18n audit in a parallel job instead of after Visual
        required: true
        default: false
        type: boolean

jobs:
  visual-regression:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VISUAL_WORKERS: ${{ inputs.visual-workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run test:visual -- --workers="$VISUAL_WORKERS"
        shell: bash
      - name: Keep the Visual results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp1-visual-results
          path: test-results/visual/
          if-no-files-found: ignore
          retention-days: 14

  i18n-audit-sequential:
    if: ${{ !inputs.parallel-i18n }}
    permissions:
      contents: read
    needs: visual-regression
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run i18n:audit
        env:
          I18N_AUDIT_LANGS: pseudo,el,nl,ar,ja
      - name: Keep the i18n audit results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp1-i18n-audit-results
          path: test-results/i18n-audit/
          if-no-files-found: ignore
          retention-days: 14

  i18n-audit-parallel:
    if: ${{ inputs.parallel-i18n }}
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run i18n:audit
        env:
          I18N_AUDIT_LANGS: pseudo,el,nl,ar,ja
      - name: Keep the i18n audit results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cp1-i18n-audit-results
          path: test-results/i18n-audit/
          if-no-files-found: ignore
          retention-days: 14
