name: Weekly i18n layout audit

# The layout audit (test/visual/i18n-layout.audit.ts) in every language and the
# pseudo-locale. Changes to the interface run a sample of languages in
# checks.yml; this catches what the sample leaves out.

permissions: {}

on:
  schedule:
    - cron: '37 4 * * 2'
  workflow_dispatch:

jobs:
  i18n-audit:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run i18n:audit

      # summary.md and a screenshot of each problem, outlined.
      - name: Keep the audit results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i18n-audit-results
          path: test-results/i18n-audit/
          if-no-files-found: ignore
          retention-days: 14
