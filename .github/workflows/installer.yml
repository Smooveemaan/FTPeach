name: Installer

# The installer on a throwaway GitHub-hosted Windows runner (test/e2e/install.vm.ts):
# a clean install, uninstalling with and without the data, upgrading the
# previous published release with a profile in place, and the updater
# installing from a local feed, for the installed and the portable copy,
# including updates that are damaged or fail. The installers are this
# checkout's release build with a test key (scripts/release/test-installers.ts).
# A release gate (release.yml), and on demand.

permissions: {}

on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        default: ''
      candidate-artifact:
        type: string
        default: ''
      candidate-run-id:
        type: string
        default: ''
      production:
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: installer-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  installer:
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Production packages are downloaded; only their acceptance tools come from this workflow.
          ref: ${{ inputs.production && github.workflow_sha || inputs.source-sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # test-installers writes to this target directory instead of src-tauri/target.
          cache-directories: .tools/installer-target

      - run: npm ci

      - name: Download the final candidate
        if: inputs.production
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.candidate-artifact }}
          run-id: ${{ inputs.candidate-run-id || github.run_id }}
          github-token: ${{ github.token }}
          path: release-candidate

      - name: Verify final candidate bytes
        if: inputs.production
        run: node --experimental-strip-types scripts/release/candidate.ts release-candidate --verify

      # The profiles the tests put in place name the IIS FTP account and the
      # OpenSSH server.
      - name: Install IIS FTP and WebDAV test sites
        if: ${{ !inputs.production }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-servers/iis.ps1 install

      - name: Install the OpenSSH SFTP test server
        if: ${{ !inputs.production }}
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-servers/openssh.ps1 install

      - name: Build the test installers
        if: ${{ !inputs.production }}
        run: npm run build:test-installers

      # The previous release is read from GitHub; the token keeps the API
      # within its limits.
      - name: Run the installer tests
        if: ${{ !inputs.production }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:e2e:vm

      - name: Accept the final packages without rebuilding
        if: inputs.production
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/test-results/release-acceptance-results.json
        run: npx playwright test --config test/e2e/playwright.config.ts --project=release --reporter=list,json

      - name: Bind acceptance to the tested files
        if: inputs.production
        run: node --experimental-strip-types scripts/release/record-acceptance.ts

      - name: Record independent production acceptance
        if: inputs.production
        id: proof
        run: node --experimental-strip-types scripts/release/validate-candidate.ts record installer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.production
        with:
          name: ${{ steps.proof.outputs.evidence }}
          path: release-evidence/installer/
          if-no-files-found: error
          retention-days: 30

      - name: Keep the test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-results-${{ github.run_attempt }}
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
