name: Published release

on:
  release:
    types: [published]

permissions: {}

jobs:
  public-files:
    outputs:
      tools-sha: ${{ steps.tools.outputs.sha }}
      unix-previous: ${{ steps.verify.outputs.unix-previous }}
    permissions:
      actions: read
      contents: read
      attestations: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - id: tools
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: verify
        name: Verify published package bytes, signatures, feed and Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/release/check-published.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-update-inputs
          path: |
            published-release/candidate.json
            published-release/latest.json
            published-release/FTPeach_*_x64-setup.exe
            published-release/FTPeach_*_x64-portable.zip
            published-release/FTPeach_*.app.tar.gz
            published-release/FTPeach_*.AppImage
            published-release/FTPeach_*.deb
          retention-days: 1
          if-no-files-found: error

  public-update:
    needs: public-files
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        mode: [installed, portable]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.public-files.outputs.tools-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: published-update-inputs
          path: published-release
      - name: Update previous published copy through the public feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FTPEACH_UPDATE_MODE: ${{ matrix.mode }}
          FTPEACH_UPDATE_TOOLS_SHA: ${{ needs.public-files.outputs.tools-sha }}
        run: npx playwright test --config test/e2e/published-update.config.ts
      - name: Preserve postpublication updater evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-update-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/published-update/**/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Record real updater result
        if: success()
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Real public-feed ${{ matrix.mode }} update passed; executable/About version, staged package hash, profile, bookmark, DPAPI password and recovered data checked.'

  public-update-macos:
    needs: public-files
    if: needs.public-files.outputs.unix-previous == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.public-files.outputs.tools-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: published-update-inputs
          path: published-release
      - name: Update previous published macOS app through the public feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FTPEACH_UPDATE_MODE: macos
          FTPEACH_UPDATE_TOOLS_SHA: ${{ needs.public-files.outputs.tools-sha }}
        run: node --experimental-strip-types scripts/release/published-update-unix.ts
      - name: Preserve postpublication updater evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-update-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/published-update/macos/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Record real updater result
        if: success()
        run: echo 'Real public-feed macOS update passed; bundle version, codesign, staged package hash, profile, settings and recovered data checked.' >> "$GITHUB_STEP_SUMMARY"

  public-update-linux:
    needs: public-files
    if: needs.public-files.outputs.unix-previous == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        mode: [appimage, deb]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.public-files.outputs.tools-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: published-update-inputs
          path: published-release
      - name: Install headless Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libfuse2 fuse3 libwebkit2gtk-4.1-0 libayatana-appindicator3-1
          if [ "${{ matrix.mode }}" = "deb" ]; then
            sudo apt-get purge -y zenity kdialog || true
          fi
      - name: Update previous published Linux package through the public feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FTPEACH_UPDATE_MODE: ${{ matrix.mode }}
          FTPEACH_UPDATE_TOOLS_SHA: ${{ needs.public-files.outputs.tools-sha }}
        run: dbus-run-session -- xvfb-run -a node --experimental-strip-types scripts/release/published-update-unix.ts
      - name: Preserve postpublication updater evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-update-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/published-update/${{ matrix.mode }}/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Record real updater result
        if: success()
        run: echo 'Real public-feed Linux ${{ matrix.mode }} update passed; updated package, staged package hash, profile, settings and recovered data checked.' >> "$GITHUB_STEP_SUMMARY"
