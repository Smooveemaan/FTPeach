name: Release

on:
  push:
    tags:
      - 'v*'
  # Only to release a tag without the closed suites' status, when their runs
  # cannot report (docs/release-trust.md#how-releases-are-verified). The reason
  # is written into the run's summary.
  workflow_dispatch:
    inputs:
      skip-private-suites:
        description: Publish without a green private-suites status
        type: boolean
        default: false
      reason:
        description: Why the status is skipped (required when skipping)
        type: string
        default: ''

permissions: {}

jobs:
  # Releases run the full shared suite without path filtering.
  gates:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      force-all: true

  # The closed end-to-end, server matrix and protocol suites run in a private
  # repository on the commit to be tagged and report the `private-suites`
  # commit status here. This job only reads it; it never starts those runs.
  private-suites:
    permissions:
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a green private-suites status on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP: ${{ inputs.skip-private-suites }}
          REASON: ${{ inputs.reason }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "A release runs on a v* tag, not $GITHUB_REF." >&2; exit 1 ;;
          esac
          if [ "$SKIP" = "true" ]; then
            if [ -z "$(printf '%s' "$REASON" | tr -d '[:space:]')" ]; then
              echo 'Skipping the private-suites status needs a reason.' >&2
              exit 1
            fi
            printf '### private-suites NOT CHECKED\n\nSkipped by %s: %s\n' "$GITHUB_ACTOR" "$REASON" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" \
            --jq '[.[] | select(.context == "private-suites")][0].state // "missing"')"
          echo "private-suites on $GITHUB_SHA: $state"
          if [ "$state" != success ]; then
            echo 'Run the pre-release check of the closed suites on this commit first.' >&2
            exit 1
          fi

  # Install, uninstall and update with the installer this tag builds, on a
  # throwaway runner.
  installer:
    permissions:
      contents: read
    uses: ./.github/workflows/installer.yml

  # The signing secrets live in the `release` environment. Naming it below
  # does not prove anyone has to approve the run, so the rules are read first.
  release-environment:
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Require approval before the signing secrets are released
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types scripts/release/check-release-environment.ts

  publish-windows:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [gates, private-suites, installer, release-environment]
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        run: npm run check:release-config

      - name: Generate npm and Cargo CycloneDX SBOMs
        run: npm run sbom:generate

      - name: Download pinned libsodium archive
        shell: powershell
        run: Invoke-WebRequest -Uri 'https://github.com/jedisct1/libsodium/releases/download/1.0.22-RELEASE/libsodium-1.0.22-msvc.zip' -OutFile "$env:RUNNER_TEMP\libsodium.zip"

      - name: Prepare verified libsodium CRT and symbols
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/with-libsodium.ps1 -ArchivePath "$env:RUNNER_TEMP\libsodium.zip" -EnvironmentFile "$env:GITHUB_ENV" -Command prepare

      - name: Build release notes from CHANGELOG.md
        id: release-notes
        run: node --experimental-strip-types scripts/release/build-release-notes.ts

      - name: Build, sign updater artifacts and create draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: FTPeach v__VERSION__
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # The updater reads the signature from latest.json; the .sig stays in the bundle
          # directory for the verification below.
          uploadUpdaterSignatures: false
          args: --bundles nsis

      # The program the installer carries, for people who do not install. It is
      # signed with the same key, before the step that verifies every signature.
      - name: Build and sign the portable zip
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node --experimental-strip-types scripts/release/portable.ts build
          npx tauri signer sign src-tauri/target/release/bundle/portable/*-portable.zip

      - name: Verify every generated updater signature
        shell: powershell
        run: |
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $key = $config.plugins.updater.pubkey
          $signatures = @(Get-ChildItem -Recurse -Path src-tauri/target/release/bundle -Filter '*.sig')
          if ($signatures.Count -eq 0) { throw 'No signed updater artifact was generated' }
          foreach ($signature in $signatures) {
            $artifact = $signature.FullName.Substring(0, $signature.FullName.Length - 4)
            if (-not (Test-Path -LiteralPath $artifact)) { throw "Missing updater artifact for $($signature.FullName)" }
            cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify_updater -- $key $artifact $signature.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Report updater signature, Authenticode, key absence and advisory exceptions
        shell: powershell
        env:
          # Read only to prove the key is absent from what gets published.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/release/release-trust-report.ts

      - name: Attest build provenance of the installer and the portable zip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/portable/*-portable.zip

      # A portable copy reads its own entry of latest.json, so the zip is
      # added to the feed the build step uploaded.
      - name: Publish the portable zip and add it to the update feed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/portable/*-portable.zip --clobber
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir release --clobber
          zip_url=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[] | select(.name | endswith("-portable.zip")) | .apiUrl')
          node --experimental-strip-types scripts/release/portable.ts feed release/latest.json "$zip_url"
          gh release upload "$GITHUB_REF_NAME" release/latest.json --clobber

      - name: Attach SBOMs and the trust report to the draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One archive, so the release asset list is the installer, latest.json and the audit files.
          Compress-Archive -Path release/sbom/ftpeach-npm.cdx.json, release/sbom/ftpeach-cargo.cdx.json, release/release-trust-report.md -DestinationPath release/release-audit.zip
          gh release upload "$env:GITHUB_REF_NAME" release/release-audit.zip --clobber
