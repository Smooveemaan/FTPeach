rules:
  - id: rust-ipc-path-traversal
    languages: [rust]
    severity: ERROR
    message: IPC input reaches a filesystem path without a containment check (CWE-22).
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              #[tauri::command]
              async fn $FUNC(..., $INPUT: $TYPE, ...) { ... }
          - focus-metavariable: $INPUT
          - metavariable-regex:
              metavariable: $TYPE
              regex: '^(?!(?:tauri::)?(?:State|AppHandle|WebviewWindow)(?:<|$)).*$'
      - patterns:
          - pattern-inside: |
              #[tauri::command]
              fn $FUNC(..., $INPUT: $TYPE, ...) { ... }
          - focus-metavariable: $INPUT
          - metavariable-regex:
              metavariable: $TYPE
              regex: '^(?!(?:tauri::)?(?:State|AppHandle|WebviewWindow)(?:<|$)).*$'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: std::fs::read($PATH)
              - pattern: std::fs::read_to_string($PATH)
              - pattern: std::fs::write($PATH, ...)
              - pattern: std::fs::remove_file($PATH)
              - pattern: std::fs::copy($PATH, ...)
              - pattern: std::fs::copy(..., $PATH)
              - pattern: std::fs::rename($PATH, ...)
              - pattern: std::fs::rename(..., $PATH)
              - pattern: std::fs::File::open($PATH)
              - pattern: std::fs::File::create($PATH)
              - pattern: std::fs::read_dir($PATH)
              - pattern: std::fs::remove_dir_all($PATH)
              - pattern: std::fs::hard_link($PATH, ...)
              - pattern: std::fs::hard_link(..., $PATH)
              - pattern: std::os::unix::fs::symlink($PATH, ...)
              - pattern: std::os::unix::fs::symlink(..., $PATH)
              - pattern: std::os::windows::fs::symlink_file($PATH, ...)
              - pattern: std::os::windows::fs::symlink_file(..., $PATH)
              - pattern: std::os::windows::fs::symlink_dir($PATH, ...)
              - pattern: std::os::windows::fs::symlink_dir(..., $PATH)
              - pattern: tokio::fs::read($PATH)
              - pattern: tokio::fs::read_to_string($PATH)
              - pattern: tokio::fs::write($PATH, ...)
              - pattern: tokio::fs::remove_file($PATH)
              - pattern: tokio::fs::copy($PATH, ...)
              - pattern: tokio::fs::copy(..., $PATH)
              - pattern: tokio::fs::rename($PATH, ...)
              - pattern: tokio::fs::rename(..., $PATH)
              - pattern: tokio::fs::File::open($PATH)
              - pattern: tokio::fs::File::create($PATH)
              - pattern: tokio::fs::read_dir($PATH)
              - pattern: tokio::fs::remove_dir_all($PATH)
              - pattern: tokio::fs::hard_link($PATH, ...)
              - pattern: tokio::fs::hard_link(..., $PATH)
              - pattern: tokio::fs::symlink($PATH, ...)
              - pattern: tokio::fs::symlink(..., $PATH)
              - pattern: tokio::fs::symlink_file($PATH, ...)
              - pattern: tokio::fs::symlink_file(..., $PATH)
              - pattern: tokio::fs::symlink_dir($PATH, ...)
              - pattern: tokio::fs::symlink_dir(..., $PATH)
              - pattern: $OPTIONS.open($PATH)
          - focus-metavariable: $PATH
    pattern-sanitizers:
      # security/connection_guard.rs replaces separators and unsafe components.
      - pattern: safe_temp_name(...)
      # OpenWithIntent derives only local_name with safe_temp_name.
      - pattern: $INTENT.local_name
  - id: rust-disabled-tls-verification
    languages: [rust]
    severity: ERROR
    message: Do not disable TLS certificate or hostname verification (CWE-295).
    pattern-either:
      - pattern: $CLIENT.danger_accept_invalid_certs(true)
      - pattern: $CLIENT.danger_accept_invalid_hostnames(true)
  - id: typescript-dynamic-code
    languages: [typescript, javascript]
    severity: ERROR
    message: Do not execute strings as code in the renderer (CWE-95).
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)
      - pattern: window.eval(...)
      - pattern: globalThis.eval(...)
      - pattern: (0, eval)(...)
  - id: typescript-html-injection
    languages: [typescript, javascript]
    severity: ERROR
    message: Render untrusted values as text, not HTML (CWE-79).
    pattern-either:
      - pattern: $ELEMENT.innerHTML = $VALUE
      - pattern: $ELEMENT.outerHTML = $VALUE
      - pattern: $ELEMENT.insertAdjacentHTML(...)
      - pattern: document.write(...)
      - pattern: document.writeln(...)
      - pattern: <$TAG ... dangerouslySetInnerHTML={$VALUE} ... />
      - pattern: '<$TAG ... {...{ dangerouslySetInnerHTML: $VALUE }} ... />'
  - id: rust-credential-debug
    languages: [rust]
    severity: ERROR
    message: A derived Debug prints these credentials in the clear; use SensitiveString for one string or a redacted wrapper for collections and binary secrets (CWE-532).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  #[derive(..., Debug, ...)]
                  struct $STRUCT { ..., $FIELD: $TYPE, ... }
              - pattern: |
                  #[derive(..., Debug, ...)]
                  pub struct $STRUCT { ..., $FIELD: $TYPE, ... }
              - pattern: |
                  #[derive(..., Debug, ...)]
                  pub(crate) struct $STRUCT { ..., $FIELD: $TYPE, ... }
          - metavariable-regex:
              metavariable: $FIELD
              regex: (?i).*(password|passphrase|secret|token|private_key).*
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(String|Option<String>|Vec<String>|Vec<u8>|Option<Vec<u8>>)$
      # Semgrep 1.176.1 cannot parse ellipses between enum variants.
      - pattern-regex: '(?ms)^[ \t]*#\[derive\([^\]]*\bDebug\b[^\]]*\)\]\s*(?:pub(?:\(crate\))?\s+)?enum\s+[A-Za-z_][A-Za-z0-9_]*[^{]*\{(?:(?!^\}).)*?\b[A-Za-z0-9_]*(?i:password|passphrase|secret|token|private_key)[A-Za-z0-9_]*\s*:\s*(?:String|Option<String>|Vec<String>|Vec<u8>|Option<Vec<u8>>)(?=\s*[,}])'
  - id: rust-unbounded-channel
    languages: [rust]
    severity: ERROR
    message: An unbounded channel grows as fast as its sender, which may be a server or the renderer; use a bounded channel with backpressure or a counted drop (CWE-770).
    paths:
      exclude:
        - '*_tests.rs'
        - 'tests.rs'
    patterns:
      - pattern-either:
          - pattern: tokio::sync::mpsc::unbounded_channel()
          - pattern: mpsc::unbounded_channel()
          - pattern: unbounded_channel()
          - pattern: std::sync::mpsc::channel()
          - pattern: crossbeam_channel::unbounded()
      - pattern-not-inside: |
          mod tests { ... }
  - id: rust-security-setting-outside-policy
    languages: [rust]
    severity: ERROR
    message: Security settings change only through security::security_policy, which decides what counts as weakening; use its constants instead of the raw key.
    paths:
      exclude:
        - '*_tests.rs'
        - 'tests.rs'
        - 'security_policy.rs'
    patterns:
      - pattern-regex: '"(showSecurityConfirmations|vaultAutoLockMinutes|strictHostKeyCheck)"'
      - pattern-not-inside: |
          mod tests { ... }
