[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0", "BSD-2-Clause",
  "BSD-3-Clause", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT",
  "MPL-2.0", "Unicode-3.0", "Zlib"
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
