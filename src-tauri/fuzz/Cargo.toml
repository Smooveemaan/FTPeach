[package]
name = "ftpeach-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Compile the production parser sources without the desktop/Tauri dependency graph.
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
anyhow = "1.0.104"
chrono = "0.4.45"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false }
quick-xml = "0.42.0"
percent-encoding = "2.3.2"
suppaftp = { version = "=12.1.1", default-features = false, features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "macros"] }
russh-sftp = "=3.0.1"
# runtime/update_staging.rs
log = "0.4.34"
base64 = "0.23.1"
minisign-verify = "0.2.5"
semver = "1.0.28"
serde_json = "1.0.151"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4.46"
flate2 = "1.1.10"
plist = "1.10.1"
backhand = { version = "=0.25.5", default-features = false, features = ["gzip", "xz"] }
zstd = { version = "=0.14.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# The tests of the included modules.
uuid = { version = "1.26.0", features = ["v4"] }

[[bin]]
name = "list_parse"
path = "fuzz_targets/list_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ftp_response"
path = "fuzz_targets/ftp_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "webdav_propfind"
path = "fuzz_targets/webdav_propfind.rs"
test = false
doc = false
bench = false

[[bin]]
name = "names_paths"
path = "fuzz_targets/names_paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "update_package"
path = "fuzz_targets/update_package.rs"
test = false
doc = false
bench = false
