# threeproxy: 3proxy answering SOCKS4, SOCKS4a and SOCKS5 without
# authentication. It exists for SOCKS4a, which Dante does not implement (it
# takes the 0.0.0.x marker address literally). Hostnames resolve through
# Docker's embedded DNS, so compose service names work as targets.
nserver 127.0.0.11
nscache 65536
log
logformat "L%t %N.%p %E %C:%c %R:%r %O %I %T"
auth none
allow *
socks -p1080
