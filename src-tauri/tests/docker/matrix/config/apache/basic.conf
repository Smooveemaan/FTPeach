# apache_basic: mod_dav over plain HTTP with Basic auth. small/ is a 16 MiB tmpfs.
Listen 80
<VirtualHost *:80>
    DocumentRoot /srv/dav
</VirtualHost>
DavLockDB /var/lib/apache2/davlock/DavLock
LimitXMLRequestBody 0
CustomLog /proc/self/fd/1 combined

<Directory /srv/dav>
    Dav On
    Options Indexes FollowSymLinks
    AllowOverride None
    DirectoryIndex disabled
    AuthName "FTPeach matrix"
    AuthType Basic
    AuthBasicProvider file
    AuthUserFile /etc/apache2/dav.htpasswd
    Require valid-user
</Directory>
