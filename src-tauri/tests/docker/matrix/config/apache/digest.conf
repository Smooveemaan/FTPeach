# apache_digest: Digest authentication only. A Basic-only client must report
# an authentication failure it can explain, not a generic error.
Listen 80
<VirtualHost *:80>
    DocumentRoot /srv/dav
</VirtualHost>
DavLockDB /var/lib/apache2/davlock/DavLock
LimitXMLRequestBody 0
CustomLog /proc/self/fd/1 combined

<Directory /srv/dav>
    Dav On
    Options Indexes FollowSymLinks
    AllowOverride None
    DirectoryIndex disabled
    AuthName "FTPeach matrix"
    AuthType Digest
    AuthDigestProvider file
    AuthUserFile /etc/apache2/dav.htdigest
    Require valid-user
</Directory>
