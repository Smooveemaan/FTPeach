# apache_https: HTTPS with a certificate from the matrix test CA. Without that
# CA the client must report an invalid certificate.
Listen 443
<VirtualHost *:443>
    DocumentRoot /srv/dav
    SSLEngine on
    SSLCertificateFile /tls/localhost.pem
    SSLCertificateKeyFile /tls/localhost.key
</VirtualHost>
DavLockDB /var/lib/apache2/davlock/DavLock
LimitXMLRequestBody 0
CustomLog /proc/self/fd/1 combined

<Directory /srv/dav>
    Dav On
    Options Indexes FollowSymLinks
    AllowOverride None
    DirectoryIndex disabled
    AuthName "FTPeach matrix"
    AuthType Basic
    AuthBasicProvider file
    AuthUserFile /etc/apache2/dav.htpasswd
    Require valid-user
</Directory>
