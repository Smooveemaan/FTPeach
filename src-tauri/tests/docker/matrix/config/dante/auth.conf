# dante_auth: SOCKS5 with username/password (proxyuser / proxypass). SOCKS4
# carries no password and is refused.
logoutput: stderr
internal: 0.0.0.0 port = 1080
external: eth0
clientmethod: none
socksmethod: username
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect bind
    log: connect error
    socksmethod: username
}
