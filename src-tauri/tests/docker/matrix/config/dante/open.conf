# dante: no authentication, SOCKS5 and SOCKS4 on one port. Dante does not
# implement SOCKS4a; the threeproxy service covers that. Targets are reached by
# compose service name, so SOCKS5 exercises proxy-side DNS resolution.
logoutput: stderr
internal: 0.0.0.0 port = 1080
external: eth0
clientmethod: none
socksmethod: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect bind
    log: connect error
}
