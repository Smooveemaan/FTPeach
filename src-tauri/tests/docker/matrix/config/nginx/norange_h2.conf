# nginx_norange_h2: HTTPS with HTTP/2 and byte ranges disabled (max_ranges 0),
# so a resumed download gets the whole body with 200 instead of 206.
dav_ext_lock_zone zone=davlock:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /tls/localhost.pem;
    ssl_certificate_key /tls/localhost.key;
    root /srv/dav;
    client_max_body_size 0;
    client_body_temp_path /tmp/nginx-body;
    max_ranges 0;

    location / {
        auth_basic "FTPeach matrix";
        auth_basic_user_file /etc/nginx/dav.htpasswd;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_ext_lock zone=davlock;
        dav_access user:rw group:r all:r;
        create_full_put_path on;
        autoindex on;
    }
}
