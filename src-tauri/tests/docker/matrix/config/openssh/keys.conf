# openssh_keys: public-key login only (ed25519, RSA, ECDSA, passphrase-protected
# ed25519). Passwords are refused.
Port 22
PermitRootLogin no
UsePAM yes
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
UseDNS no
PrintMotd no
LogLevel VERBOSE
# Every test connection arrives from the same Docker gateway address, and
# wrong-password or failed-negotiation tests are deliberate: without these,
# OpenSSH 10 penalises and throttles that address for the rest of the run.
PerSourcePenalties no
MaxStartups 100:30:200
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_rsa_key
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
Subsystem sftp internal-sftp
