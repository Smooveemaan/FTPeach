# openssh_legacy: an old NAS/router profile. Only SHA-1 era algorithms are
# offered: ssh-rsa host key signatures, diffie-hellman-group14-sha1, CBC
# ciphers and hmac-sha1. A client that cannot negotiate them must fail with a
# negotiation error.
Port 22
PermitRootLogin no
UsePAM yes
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
UseDNS no
PrintMotd no
LogLevel VERBOSE
# Every test connection arrives from the same Docker gateway address, and
# wrong-password or failed-negotiation tests are deliberate: without these,
# OpenSSH 10 penalises and throttles that address for the rest of the run.
PerSourcePenalties no
MaxStartups 100:30:200
HostKey /etc/ssh/ssh_host_rsa_key
HostKeyAlgorithms ssh-rsa
KexAlgorithms diffie-hellman-group14-sha1,diffie-hellman-group1-sha1
Ciphers aes128-cbc,aes256-cbc,3des-cbc
MACs hmac-sha1
PubkeyAcceptedAlgorithms ssh-rsa
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
Subsystem sftp internal-sftp
