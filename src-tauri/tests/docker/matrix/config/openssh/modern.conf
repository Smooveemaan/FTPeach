# openssh_modern: a strict current server. ed25519 host key only, post-quantum
# hybrid key exchange, AEAD ciphers only.
Port 22
PermitRootLogin no
UsePAM yes
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
UseDNS no
PrintMotd no
LogLevel VERBOSE
# Every test connection arrives from the same Docker gateway address, and
# wrong-password or failed-negotiation tests are deliberate: without these,
# OpenSSH 10 penalises and throttles that address for the rest of the run.
PerSourcePenalties no
MaxStartups 100:30:200
HostKey /etc/ssh/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
PubkeyAcceptedAlgorithms ssh-ed25519
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
Subsystem sftp internal-sftp
