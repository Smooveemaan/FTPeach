# ProFTPD FTP/FTPS targets. Everything that differs between them lives in the
# variant file mounted at /etc/proftpd/variant.conf.
Include /etc/proftpd/matrix-common.conf
LoadModule mod_tls.c

ServerName "FTPeach matrix ProFTPD"
Port 21
MasqueradeAddress 127.0.0.1
# LIST shows dot-files (MLSD always does).
ListOptions "-a"
MaxClientsPerHost 8 "Too many connections from your host (limit %m)"

<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired off
  TLSVerifyClient off
  # ProFTPD's default requires the data connection to resume the control TLS
  # session. Session reuse is what vsftpd_reuse covers; here it is switched
  # off so the ProFTPD targets test MLSD, TLS versions and certificates alone.
  TLSOptions NoSessionReuseRequired
  TLSRenegotiate none
</IfModule>

Include /etc/proftpd/variant.conf

# Anonymous read-only access to the same fixtures.
<Anonymous /home/testuser>
  User ftp
  Group nogroup
  UserAlias anonymous ftp
  RequireValidShell off
  <Limit WRITE SITE_CHMOD>
    DenyAll
  </Limit>
</Anonymous>
