# proftpd_sftp: SFTP served by ProFTPD's mod_sftp, an SSH implementation not
# derived from OpenSSH. Password and public-key logins are both accepted.
Include /etc/proftpd/matrix-common.conf
LoadModule mod_sftp.c

ServerName "FTPeach matrix ProFTPD mod_sftp"
Port 22

<IfModule mod_sftp.c>
  SFTPEngine on
  SFTPHostKey /etc/proftpd/hostkeys/rsa
  SFTPHostKey /etc/proftpd/hostkeys/ecdsa
  SFTPHostKey /etc/proftpd/hostkeys/ed25519
  SFTPAuthMethods publickey password
  SFTPAuthorizedUserKeys file:/etc/proftpd/authorized_keys/%u
  SFTPCompression delayed
</IfModule>
