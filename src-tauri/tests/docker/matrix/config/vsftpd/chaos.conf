# vsftpd_chaos: behind toxiproxy (chaos profile), control and passive data
# alike. Toxiproxy listens on 31040-31049 itself and forwards each port to the
# same port here, so the advertised PASV address and port lead through it.
listen_port=21
pasv_min_port=31040
pasv_max_port=31049
pasv_address=127.0.0.1
force_local_logins_ssl=NO
force_local_data_ssl=NO
require_ssl_reuse=NO
