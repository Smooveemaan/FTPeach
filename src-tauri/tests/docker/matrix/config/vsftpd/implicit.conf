# vsftpd_implicit: implicit FTPS, TLS starts before the 220 banner. The client
# does not support it and must fail with a clear error, not hang to a timeout.
listen_port=990
implicit_ssl=YES
pasv_min_port=31030
pasv_max_port=31039
pasv_address=127.0.0.1
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
