# vsftpd_nat: a server behind NAT that advertises an unreachable private address
# in its PASV reply. The client has to connect to the control connection's
# address instead.
listen_port=21
pasv_min_port=31020
pasv_max_port=31029
pasv_address=10.255.255.1
force_local_logins_ssl=NO
force_local_data_ssl=NO
require_ssl_reuse=NO
