# vsftpd: explicit FTPS optional, no TLS session reuse required, LIST only
# (vsftpd never implements MLSD), dot-files hidden from LIST.
listen_port=21
pasv_min_port=31000
pasv_max_port=31009
pasv_address=127.0.0.1
force_local_logins_ssl=NO
force_local_data_ssl=NO
require_ssl_reuse=NO
# This target also sits behind toxiproxy (chaos profile): the control
# connection then arrives from the toxiproxy container while data connections
# come straight from the host, which vsftpd refuses (425) unless the
# data-connection address check is off.
pasv_promiscuous=YES
