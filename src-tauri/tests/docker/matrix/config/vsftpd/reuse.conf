# vsftpd_reuse: FTPS mandatory and the data connection must resume the control
# connection's TLS session (vsftpd answers "522 SSL connection failed: session
# reuse required" otherwise).
listen_port=21
pasv_min_port=31010
pasv_max_port=31019
pasv_address=127.0.0.1
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=YES
