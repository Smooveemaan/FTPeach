# Settings shared by the FTP and SFTP ProFTPD targets.
ModulePath /usr/lib/proftpd
LoadModule mod_ls.c
LoadModule mod_xfer.c
LoadModule mod_site_misc.c

ServerType standalone
DefaultServer on
UseIPv6 off
User proftpd
Group nogroup
Umask 022
MaxInstances 50
ScoreboardFile /run/proftpd/proftpd.scoreboard
PidFile /run/proftpd/proftpd.pid
UseReverseDNS off
RequireValidShell off
AuthOrder mod_auth_unix.c
DefaultRoot ~
AllowOverwrite on
AllowStoreRestart on
AllowRetrieveRestart on
TransferLog none
WtmpLog off

<Limit WRITE SITE_CHMOD>
  DenyUser readonly
</Limit>
