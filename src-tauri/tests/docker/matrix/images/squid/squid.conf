http_port 3128 name=open
http_port 3129 name=auth

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm FTPeach matrix proxy
auth_param basic credentialsttl 1 minute

acl open_port myportname open
acl auth_port myportname auth
acl authenticated proxy_auth REQUIRED

# Test proxy: CONNECT to any port (FTP control/data, SSH, WebDAV), no caching.
http_access allow open_port
http_access allow auth_port authenticated
http_access deny all

cache deny all
access_log none
# squid -d 1 already echoes cache.log to stderr; after dropping to the proxy
# user it cannot reopen /dev/stdout or /dev/stderr itself.
cache_log /dev/null
pid_filename none
coredump_dir /tmp
shutdown_lifetime 1 second
