# Settings shared by every vsftpd variant. The variant file mounted at
# /etc/vsftpd/variant.conf is appended after this one; vsftpd rejects a
# directive given twice, so nothing below may appear in a variant file.
listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
utf8_filesystem=YES
max_per_ip=10
pasv_enable=YES
pasv_addr_resolve=NO
rsa_cert_file=/tls/localhost.pem
rsa_private_key_file=/tls/localhost.key
ssl_enable=YES
allow_anon_ssl=NO
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=YES
ssl_ciphers=HIGH
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/proc/1/fd/1
