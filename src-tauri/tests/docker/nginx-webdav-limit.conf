# The WebDAV server behind a proxy that takes uploads of at most 10 MiB and
# answers 413 above that, for checking how FTPeach reports a size limit.
server {
    listen 6066;

    location / {
        client_max_body_size 10m;
        proxy_pass http://webdav:6065;
        # webdav refuses a MOVE whose Destination names another host than Host.
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
    }
}
